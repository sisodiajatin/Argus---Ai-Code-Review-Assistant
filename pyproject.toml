[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "argus-ai-review"
version = "0.1.0"
description = "Argus - The All-Seeing Code Reviewer. AI-powered code review CLI that finds bugs, security issues, and performance problems using any LLM."
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.11"
authors = [
    {name = "Jatin Sisodiya", email = "sisodiajatin@users.noreply.github.com"},
]
keywords = ["code-review", "ai", "github", "cli", "llm", "developer-tools", "security", "linter"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development :: Quality Assurance",
    "Topic :: Software Development :: Testing",
]
dependencies = [
    "click>=8.1.0",
    "rich>=13.0.0",
    "openai>=1.59.0",
    "tiktoken>=0.8.0",
    "pydantic>=2.10.0",
    "pydantic-settings>=2.7.0",
    "python-dotenv>=1.0.1",
    "sqlalchemy>=2.0.36",
    "aiosqlite>=0.20.0",
]

[project.optional-dependencies]
# Webhook server + dashboard API (the CLI needs only the core dependencies)
server = [
    "fastapi>=0.115.0",
    "uvicorn>=0.34.0",
    "httpx>=0.28.0",
    "pyjwt[crypto]>=2.8.0",
    "python-multipart>=0.0.6",
    "itsdangerous>=2.1.0",
]
dev = [
    "argus-ai-review[server]",
    "pytest>=8.3.0",
    "pytest-asyncio>=0.25.0",
    "pytest-httpx>=0.35.0",
    "pytest-cov>=5.0.0",
    "ruff>=0.6.0",
]

[project.urls]
Homepage = "https://github.com/sisodiajatin/Argus---Ai-Code-Review-Assistant"
Repository = "https://github.com/sisodiajatin/Argus---Ai-Code-Review-Assistant"
Issues = "https://github.com/sisodiajatin/Argus---Ai-Code-Review-Assistant/issues"

[project.scripts]
argus = "cli.main:main"

[tool.setuptools.packages.find]
include = ["app*", "cli*"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
line-length = 120
target-version = "py311"
extend-exclude = ["dashboard", "docs"]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "W"]

[tool.ruff.lint.per-file-ignores]
# Sample diffs contain significant trailing whitespace (blank context lines)
"tests/test_diff_parser.py" = ["W293"]
