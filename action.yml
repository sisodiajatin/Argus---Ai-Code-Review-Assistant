name: "Argus Code Review"
description: "AI-powered code review that posts findings as PR comments"
branding:
  icon: "eye"
  color: "purple"

inputs:
  ai_api_key:
    description: "API key for the AI provider (OpenAI-compatible)"
    required: true
  ai_model:
    description: "AI model name"
    required: false
    default: "openai/gpt-oss-120b"
  ai_base_url:
    description: "Base URL for the AI API"
    required: false
    default: "https://api.groq.com/openai/v1"
  base_branch:
    description: "Base branch to compare against (default: the PR's base branch)"
    required: false
    default: ""
  ignore_paths:
    description: "Comma-separated glob patterns to ignore"
    required: false
    default: ""
  fail_on_critical:
    description: "Fail the job when critical findings are reported (true/false)"
    required: false
    default: "true"
  upload_sarif:
    description: >-
      Upload findings to GitHub code scanning (Security tab). Needs
      `permissions: security-events: write`; free on public repos, needs GitHub
      Advanced Security on private repos.
    required: false
    default: "false"
  python_version:
    description: "Python version to use"
    required: false
    default: "3.12"

outputs:
  critical_count:
    description: "Number of critical findings"
    value: ${{ steps.review.outputs.critical_count }}
  total_findings:
    description: "Total number of findings"
    value: ${{ steps.review.outputs.total_findings }}
  sarif_file:
    description: "Path to the SARIF 2.1.0 results file (for your own upload or tooling)"
    value: ${{ steps.review.outputs.sarif_file }}

runs:
  using: "composite"
  steps:
    - name: Set up Python
      uses: actions/setup-python@v7
      with:
        python-version: ${{ inputs.python_version }}

    - name: Install Argus
      shell: bash
      # Install Argus from this action's own checkout — never from the
      # repository being reviewed.
      run: pip install -q "$GITHUB_ACTION_PATH"

    - name: Run Argus Review
      id: review
      shell: bash
      # Inputs and event fields go through env vars, never ${{ }} inside the
      # script, so they can't inject shell commands.
      env:
        AI_API_KEY: ${{ inputs.ai_api_key }}
        AI_MODEL: ${{ inputs.ai_model }}
        AI_BASE_URL: ${{ inputs.ai_base_url }}
        INPUT_BASE_BRANCH: ${{ inputs.base_branch }}
        INPUT_IGNORE_PATHS: ${{ inputs.ignore_paths }}
        PR_BASE_REF: ${{ github.event.pull_request.base.ref }}
        RESULTS_FILE: ${{ runner.temp }}/argus-results.json
        SARIF_FILE: ${{ runner.temp }}/argus-results.sarif
      run: |
        set -euo pipefail

        BASE="${INPUT_BASE_BRANCH:-${PR_BASE_REF:-main}}"

        # Make sure the base branch exists locally for the merge-base diff.
        # Full history (actions/checkout fetch-depth: 0) is recommended.
        if ! git fetch --no-tags origin "+refs/heads/${BASE}:refs/remotes/origin/${BASE}"; then
          echo "::warning::Could not fetch base branch '${BASE}'"
        fi

        ARGS=(review --base "origin/${BASE}" --format json --sarif "$SARIF_FILE")
        if [ -n "${INPUT_IGNORE_PATHS}" ]; then
          ARGS+=(--ignore "${INPUT_IGNORE_PATHS}")
        fi

        # Exit codes: 0 = ok, 1 = critical findings, 2 = review failed.
        set +e
        argus "${ARGS[@]}" > "$RESULTS_FILE"
        STATUS=$?
        set -e

        if [ "$STATUS" -eq 2 ]; then
          echo "::error::Argus could not complete the review (AI provider error). See the log above."
          exit 2
        fi
        if [ "$STATUS" -gt 2 ]; then
          echo "::error::Argus exited unexpectedly with code ${STATUS}"
          exit "$STATUS"
        fi

        python3 - "$RESULTS_FILE" >> "$GITHUB_OUTPUT" <<'PY'
        import json, sys
        data = json.load(open(sys.argv[1]))
        findings = data.get("findings", [])
        print(f"critical_count={sum(1 for f in findings if f.get('severity') == 'critical')}")
        print(f"total_findings={len(findings)}")
        PY
        echo "sarif_file=$SARIF_FILE" >> "$GITHUB_OUTPUT"

    - name: Post PR Comment
      if: github.event_name == 'pull_request' || github.event_name == 'pull_request_target'
      shell: bash
      env:
        GITHUB_TOKEN: ${{ github.token }}
        REPO: ${{ github.repository }}
        PR_NUMBER: ${{ github.event.pull_request.number }}
        RESULTS_FILE: ${{ runner.temp }}/argus-results.json
      run: python3 "$GITHUB_ACTION_PATH/action_post_comment.py" "$REPO" "$PR_NUMBER" "$RESULTS_FILE"

    - name: Upload SARIF to code scanning
      if: inputs.upload_sarif == 'true' && steps.review.outputs.sarif_file != ''
      uses: github/codeql-action/upload-sarif@v4
      with:
        sarif_file: ${{ steps.review.outputs.sarif_file }}
        category: argus

    - name: Fail on critical findings
      if: inputs.fail_on_critical == 'true' && steps.review.outputs.critical_count != '0'
      shell: bash
      env:
        CRITICAL: ${{ steps.review.outputs.critical_count }}
      run: |
        echo "::error::Argus found ${CRITICAL} critical issue(s)."
        exit 1
